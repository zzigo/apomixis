<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#070909"><title>HYLON · Apomixis field console</title></head><body><header class="masthead"><div class="brand">HYLON<span>APOMIXIS / FIELD CONSOLE</span></div><div class="session-state"><span class="live-dot"></span> LOCAL SESSION <span class="version">0.6</span></div><button id="fullscreen" title="Enter fullscreen" aria-label="Enter fullscreen"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M3 9V3h6M15 3h6v6M21 15v6h-6M9 21H3v-6"/></svg></button><button id="super-panic" class="danger" title="Silence local audio, stop sources, send CC123/120 on the selected MIDI port (all channels), and request HELIOS shutdown">SUPER PANIC</button><button id="stop-all" class="danger">STOP ALL</button></header><nav class="main-nav" aria-label="Workspace"><button data-panel="capture" class="active">01 CAPTURE</button><button data-panel="config">02 I/O</button><button data-panel="sampler">03 SAMPLER</button><button data-panel="laser">04 LASER</button><button data-panel="audio">05 AUDIO</button><button data-panel="spore">06 SPORE</button><button data-panel="monitor">07 MIDI MONITOR</button><div class="nav-spacer"></div><button id="config-modal">I/O MODAL</button><button id="reset-layout">RESET LAYOUT</button></nav><main id="workspace" aria-label="Dockable workspace"></main><footer><span id="feedback" role="status" aria-live="polite">Local workspace · no network required</span><span id="storage-status">Opening local archive…</span></footer><dialog id="config-dialog"><div class="dialog-head"><span>I/O CONFIGURATION</span><button id="close-config">CLOSE</button></div><div id="modal-config"></div></dialog><script type="module" src="/src/main.js"></script></body></html>
