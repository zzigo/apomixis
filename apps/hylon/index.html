<!doctype html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><meta name="theme-color" content="#070909"><title>HYLON · Apomixis field console</title></head><body><header class="masthead"><div class="brand"><div class="brand-stack"><b>HYLON</b><span>APOMIXIS</span><small>LOCAL __HYLON_VERSION__</small></div></div><div class="scene-transport" role="group" aria-label="Active scene transport"><button id="scene-play" title="Play / resume; while running, STOP resets to the start" aria-label="Play"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="m8 5 11 7-11 7Z"/></svg></button><button id="scene-hold" title="Pause and keep position" aria-label="Hold / pause"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M8 5v14M16 5v14"/></svg></button><button id="scene-reset" title="Reset active scene" aria-label="Reset">R</button><select id="scene-speed" aria-label="Active scene speed" title="Playback speed"><option value="1">1×</option><option value="2">2×</option><option value="4">4×</option><option value="8">8×</option><option value="16">16×</option></select></div><div class="short-command"><button id="command-audio" class="command" title="Audio OFF · click to toggle · Shift+click: L/R tone" aria-label="Audio" aria-pressed="false">A</button><button id="command-midi" class="command" title="MIDI OFF · click to toggle · Shift+click: channels 1–5" aria-label="MIDI" aria-pressed="false">M</button><button id="command-laser" class="command" title="Laser OFF · click to toggle · Shift+click: full square, 1 second" aria-label="Laser" aria-pressed="false">L</button><button id="command-rec" class="command" title="REC OFF · click: record MIDI in / out and the performance log · Shift+click: also the microphone input · click again to stop" aria-label="Record performance" aria-pressed="false">●</button><div class="header-meters"><meter id="header-mic" min="0" max="1" value="0" title="MIC IN · physical channel 1" aria-label="MIC IN channel 1"></meter><meter id="header-out" min="0" max="1" value="0" title="AUDIO OUT" aria-label="Audio output"></meter></div><output id="mic-pitch" title="Mic pitch / autotune correction / follower MIDI note">— Hz · —¢ · M —</output></div><button id="fullscreen" title="Enter fullscreen" aria-label="Enter fullscreen"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><path d="M3 9V3h6M15 3h6v6M21 15v6h-6M9 21H3v-6"/></svg></button><button id="super-panic" class="danger" title="Silence local audio, stop sources, send CC64/120/121/123 and centered bend on all channels, repeat full note-off sweep twice, and request HELIOS shutdown" aria-label="Super panic">SP</button><button id="panic-2" class="danger" title="P2 · all 16 channels: sustain off, sound off, reset controllers, notes off, centered bend; then all 128 note-offs per channel, three passes with real waits">P2</button><button id="panic-sc" class="danger" title="PS · run the panic routine in your already configured SuperCollider MIDIOut through the local OSC bridge">PS</button><button id="stop-all" class="danger" title="Stop all processes" aria-label="Stop all processes"><svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linejoin="round" aria-hidden="true"><path d="M6 6h12v12H6Z"/></svg></button></header><div class="workspace-shell"><nav class="pod-rail" aria-label="Pods and workspaces"><div class="pod-rail-pods"><button data-panel="capture" aria-label="capture"></button><button data-panel="config" aria-label="config"></button><button data-panel="sampler" aria-label="sampler"></button><button data-panel="notation" aria-label="Organ pitch notation"></button><button data-panel="laser" aria-label="laser"></button><button data-panel="audio" aria-label="audio"></button><button data-panel="spore" aria-label="spore"></button><button data-panel="monitor" aria-label="monitor"></button><button data-panel="registers" aria-label="registers"></button><button data-panel="score" aria-label="score"></button><button data-panel="library" aria-label="library"></button><button data-panel="impro" aria-label="impro"></button><button data-panel="lyrics" aria-label="lyrics"></button><button data-panel="attack" aria-label="attack"></button></div><div class="pod-rail-workspaces" role="group" aria-label="Workspaces"><button data-workspace="1" title="Workspace 1 · click to recall · Shift+click to save">1</button><button data-workspace="2" title="Workspace 2 · click to recall · Shift+click to save">2</button><button data-workspace="3" title="Workspace 3 · click to recall · Shift+click to save">3</button><button data-workspace="4" title="Workspace 4 · click to recall · Shift+click to save">4</button></div><div class="pod-rail-tools"><button id="config-modal" aria-label="I/O modal"></button><button id="reset-layout" aria-label="Reset layout"></button></div></nav><main id="workspace" aria-label="Dockable workspace"></main></div><footer><span id="feedback" role="status" aria-live="polite">Local workspace · no network required</span><span id="storage-status">Opening local archive…</span></footer><dialog id="config-dialog"><div class="dialog-head"><span>I/O CONFIGURATION</span><button id="close-config">CLOSE</button></div><div id="modal-config"></div></dialog><script type="module" src="/src/main.js"></script></body></html>
